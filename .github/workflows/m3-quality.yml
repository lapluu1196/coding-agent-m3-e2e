name: M3 fixture quality
on:
  push:
    branches: ["agent/**"]
permissions:
  contents: read
jobs:
  m3-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Controlled fixture checks
        shell: bash
        run: |
          sleep 15
          python3 - <<'PY'
          from pathlib import Path
          paths = list(Path('.coding-agent-m3').glob('*.txt'))
          assert paths, 'Expected a controlled M3 fixture file'
          for path in paths:
              assert not path.is_symlink(), 'Fixture must be a regular file'
              assert path.stat().st_size <= 4096, 'Fixture too large'
              assert 'FORCE_CI_FAILURE' not in path.read_text(), 'Controlled CI failure'
          print('Controlled fixture passed; no customer scripts executed')
          PY
